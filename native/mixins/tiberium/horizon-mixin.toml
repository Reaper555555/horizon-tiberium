[mod]
id = "tiberium"
version = "0.2.0"
priority = 100

[compatibility]
horizon_revision = "66f3981f522b24c250b21523a70080965b940424"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "tiberium"
source = "runtime.rs"

# Рост полей, осушение почвы, отравление — на серверном тике игрока.
[[injection]]
id = "player-tick"
hook = "player_tick"
hook_version = 1
kind = "HEAD"
helper = "player_tick.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]

# Серверный тик: отравление и молнии ионного шторма.
[[injection]]
id = "tick"
hook = "tick"
hook_version = 1
kind = "HEAD"
helper = "tick.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]

# Правый клик: вскрытие капсулы, ультразвуковой срез.
[[injection]]
id = "use-item"
hook = "use_item"
hook_version = 1
kind = "HEAD"
helper = "use_item.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
  { name = "claimed", ty = "&mut bool", value = "claimed" },
]

# Правый клик по блоку: пустая капсула на кристалле.
[[injection]]
id = "use-item-on"
hook = "use_item_on"
hook_version = 1
kind = "HEAD"
helper = "use_item_on.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "face", ty = "[i32; 3]", value = "face" },
  { name = "claimed", ty = "&mut bool", value = "claimed" },
]

# Подбор осколка заражает.
[[injection]]
id = "item-picked-up"
hook = "item_picked_up"
hook_version = 1
kind = "HEAD"
helper = "item_picked_up.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "u128", value = "player" },
  { name = "item", ty = "&str", value = "item" },
  { name = "count", ty = "u32", value = "count" },
  { name = "canceled", ty = "&mut bool", value = "canceled" },
]

# Смена брони: следим за био-костюмом.
[[injection]]
id = "on-equip"
hook = "on_equip"
hook_version = 1
kind = "HEAD"
helper = "on_equip.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "slot", ty = "&str", value = "slot" },
  { name = "new", ty = "Option<&horizon_client::items::ItemStack>", value = "new" },
]

# Зелёный туман во время ионного шторма (клиент).
[[injection]]
id = "compute-fog-color"
hook = "compute_fog_color"
hook_version = 1
kind = "HEAD"
helper = "compute_fog_color.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "partial", ty = "f32", value = "partial" },
  { name = "camera", ty = "[f64; 3]", value = "camera" },
  { name = "fog_type", ty = "horizon_client::fog::FogType", value = "fog_type" },
  { name = "rgb", ty = "&mut [f32; 3]", value = "rgb" },
]

# Тряска камеры во время шторма (клиент).
[[injection]]
id = "camera-shake"
hook = "camera_shake"
hook_version = 1
kind = "HEAD"
helper = "camera_shake.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "partial", ty = "f32", value = "partial" },
  { name = "shake", ty = "&mut horizon_client::mod_api::NativeShake", value = "shake" },
]

# Молнии шторма не поджигают землю.
[[injection]]
id = "block-ignite"
hook = "block_ignite"
hook_version = 1
kind = "HEAD"
helper = "block_ignite.rs"
bindings = [
  { name = "game", ty = "&crate::game::GameLevel<'_>", value = "self" },
  { name = "dimension", ty = "horizon_world::level::Dimension", value = "dimension" },
  { name = "player", ty = "Option<u128>", value = "player" },
  { name = "pos", ty = "horizon_core::position::BlockPos", value = "pos" },
  { name = "cause", ty = "&str", value = "cause" },
  { name = "cancel", ty = "&mut bool", value = "cancel" },
]
